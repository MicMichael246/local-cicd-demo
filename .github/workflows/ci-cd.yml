name: Local CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "platform/**"
      - "k8s/**"
      - "argocd/**"
      - "*.md"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/micmichael246/demo-app
  PIP_DEFAULT_TIMEOUT: "100"
  PIP_RETRIES: "10"
  TRIVY_IMAGE: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign@sha256:d91bc4e7e95e8d2f549c747a72dc174f90579e410a1695f57f686674f84ce849
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          . .venv/bin/activate
          flake8 app.py test_app.py

      - name: Test
        run: |
          . .venv/bin/activate
          python -m pytest

  security:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" \
            $GITLEAKS_IMAGE detect --source /repo --redact --no-banner

      - name: Install security tools
        run: |
          python3 -m venv .venv-sec
          . .venv-sec/bin/activate
          pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Code scan (Bandit)
        run: |
          . .venv-sec/bin/activate
          bandit -r app.py -ll

      - name: Dependency scan (pip-audit)
        run: |
          . .venv-sec/bin/activate
          pip-audit -r requirements.txt

  build:
    needs: [test, security]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Scan image (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            $TRIVY_IMAGE image --skip-db-update \
            --severity CRITICAL --exit-code 1 --ignore-unfixed \
            $IMAGE_NAME:${{ github.sha }}

      - name: Scan Dockerfile and manifests (Trivy)
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            $TRIVY_IMAGE config --skip-check-update \
            --severity HIGH,CRITICAL --exit-code 1 /src

      - name: Generate SBOM (Trivy, CycloneDX)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            -v "$PWD:/out" \
            $TRIVY_IMAGE image --skip-db-update --format cyclonedx \
            --output /out/sbom.cdx.json $IMAGE_NAME:${{ github.sha }}

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 30

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            echo "Login attempt $i"
            echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin && exit 0
            sleep 10
          done
          exit 1

      - name: Push image to GHCR
        run: |
          for i in 1 2 3 4 5; do
            echo "Push attempt $i"
            docker push --quiet $IMAGE_NAME:${{ github.sha }} && exit 0
            sleep 10
          done
          echo "Push failed after 5 attempts"
          exit 1

      - name: Resolve pushed image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_NAME:${{ github.sha }}" | awk '/^Digest:/ {print $2; exit}')
          echo "Digest: $DIGEST"
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign image (cosign, key-based)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for i in 1 2 3; do
            echo "Sign attempt $i"
            docker run --rm -u "$(id -u):$(id -g)" \
              -e HOME=/tmp -e DOCKER_CONFIG=/dockercfg -v "$HOME/.docker:/dockercfg:ro" \
              -e COSIGN_PRIVATE_KEY -e COSIGN_PASSWORD \
              $COSIGN_IMAGE sign --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false \
              "$IMAGE_NAME@${{ steps.digest.outputs.digest }}" && exit 0
            sleep 10
          done
          exit 1

      - name: Attach SBOM as signed attestation
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for i in 1 2 3; do
            echo "Attest attempt $i"
            docker run --rm -u "$(id -u):$(id -g)" \
              -e HOME=/tmp -e DOCKER_CONFIG=/dockercfg -v "$HOME/.docker:/dockercfg:ro" \
              -v "$PWD/sbom.cdx.json:/sbom.cdx.json:ro" \
              -e COSIGN_PRIVATE_KEY -e COSIGN_PASSWORD \
              $COSIGN_IMAGE attest --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false \
              --type cyclonedx --predicate /sbom.cdx.json \
              "$IMAGE_NAME@${{ steps.digest.outputs.digest }}" && exit 0
            sleep 10
          done
          exit 1

      - name: Verify signature and attestation
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -e HOME=/tmp -e DOCKER_CONFIG=/dockercfg -v "$HOME/.docker:/dockercfg:ro" \
            -v "$PWD/cosign.pub:/cosign.pub:ro" \
            $COSIGN_IMAGE verify --key /cosign.pub --insecure-ignore-tlog=true \
            "$IMAGE_NAME@${{ steps.digest.outputs.digest }}" > /dev/null
          docker run --rm -u "$(id -u):$(id -g)" \
            -e HOME=/tmp -e DOCKER_CONFIG=/dockercfg -v "$HOME/.docker:/dockercfg:ro" \
            -v "$PWD/cosign.pub:/cosign.pub:ro" \
            $COSIGN_IMAGE verify-attestation --key /cosign.pub --insecure-ignore-tlog=true \
            --type cyclonedx "$IMAGE_NAME@${{ steps.digest.outputs.digest }}" > /dev/null

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  update-manifest:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Commit new image tag
        run: |
          sed -i "s|^\( *image: \).*|\1${IMAGE_NAME}:${{ github.sha }}|" k8s/deployment.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || (git commit -m "Deploy ${{ github.sha }}" && git push)

  verify:
    needs: update-manifest
    runs-on: self-hosted
    steps:
      - name: Ask Argo CD to refresh now
        run: kubectl -n argocd annotate application demo-app argocd.argoproj.io/refresh=hard --overwrite

      - name: Wait for the new image to be deployed
        run: |
          for i in $(seq 1 60); do
            img=$(kubectl get deploy demo-app -o jsonpath='{.spec.template.spec.containers[0].image}')
            [ "$img" = "$IMAGE_NAME:${{ github.sha }}" ] && exit 0
            sleep 5
          done
          echo "Argo CD did not deploy the new image in time"; exit 1

      - name: Wait for rollout
        run: kubectl rollout status deployment/demo-app --timeout=300s

      - name: Smoke test
        run: |
          POD=""
          for i in $(seq 1 30); do
            POD=$(kubectl get pods -l app=demo-app -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.containers[0].image}{" "}{.metadata.deletionTimestamp}{"\n"}{end}' | awk -v img="$IMAGE_NAME:${{ github.sha }}" 'NF==2 && $2==img {print $1; exit}')
            [ -n "$POD" ] && break
            sleep 2
          done
          [ -n "$POD" ] || { echo "No running pod with the new image"; exit 1; }
          echo "Smoke testing $POD"
          for i in $(seq 1 15); do
            kubectl exec "$POD" -- python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:5000/health', timeout=3).read())" && exit 0
            sleep 3
          done
          echo "Smoke test failed"
          kubectl logs "$POD" --tail=30
          exit 1
