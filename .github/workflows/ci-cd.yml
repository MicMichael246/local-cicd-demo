name: Local CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "argocd/**"

permissions:
  contents: read

env:
  IMAGE_NAME: demo-app

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          . .venv/bin/activate
          flake8 app.py test_app.py

      - name: Test
        run: |
          . .venv/bin/activate
          python -m pytest

  security:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-banner

      - name: Install security tools
        run: |
          python3 -m venv .venv-sec
          . .venv-sec/bin/activate
          pip install bandit pip-audit

      - name: Code scan (Bandit)
        run: |
          . .venv-sec/bin/activate
          bandit -r app.py -ll

      - name: Dependency scan (pip-audit)
        run: |
          . .venv-sec/bin/activate
          pip-audit -r requirements.txt

  build:
    needs: [test, security]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Scan image (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:latest image \
            --severity CRITICAL --exit-code 1 --ignore-unfixed \
            $IMAGE_NAME:${{ github.sha }}

      - name: Scan Dockerfile and manifests (Trivy, report only)
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:latest config \
            --severity HIGH,CRITICAL --exit-code 0 /src

      - name: Load image into minikube
        run: minikube image load $IMAGE_NAME:${{ github.sha }}

  update-manifest:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Commit new image tag
        run: |
          sed -i "s|image: demo-app:.*|image: demo-app:${{ github.sha }}|" k8s/deployment.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || (git commit -m "Deploy ${{ github.sha }}" && git push)

  verify:
    needs: update-manifest
    runs-on: self-hosted
    steps:
      - name: Ask Argo CD to refresh now
        run: kubectl -n argocd annotate application demo-app argocd.argoproj.io/refresh=hard --overwrite

      - name: Wait for the new image to be deployed
        run: |
          for i in $(seq 1 36); do
            img=$(kubectl get deploy demo-app -o jsonpath='{.spec.template.spec.containers[0].image}')
            [ "$img" = "demo-app:${{ github.sha }}" ] && exit 0
            sleep 5
          done
          echo "Argo CD did not deploy the new image in time"; exit 1

      - name: Wait for rollout
        run: kubectl rollout status deployment/demo-app --timeout=120s

      - name: Smoke test
        run: |
          kubectl exec deploy/demo-app -- python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:5000/health').read())"
