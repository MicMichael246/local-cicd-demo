apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: ghcr.io/micmichael246/demo-app:14946d7b84ea060d54e4954967c690d1c9220b69
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
            
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  type: NodePort
  selector:
    app: demo-app
  ports:
    - port: 5000
      targetPort: 5000
