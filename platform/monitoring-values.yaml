defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
  disabled:
    KubeCPUOvercommit: true
    KubeMemoryOvercommit: true

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 3d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-notifications
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
    route:
      receiver: 'null'
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: 'null'
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        - receiver: telegram
          matchers: ['severity =~ "warning|critical"']
          continue: true
        - receiver: slack-warnings
          matchers: ['severity = "warning"']
    receivers:
      - name: 'null'
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-notifications/telegram-bot-token
            chat_id_file: /etc/alertmanager/secrets/alertmanager-notifications/telegram-chat-id
            send_resolved: true
            parse_mode: HTML
            message: |-
              {{ if eq .Status "resolved" }}✅ <b>RESOLVED</b>{{ else if eq .CommonLabels.severity "critical" }}🔴 <b>CRITICAL</b>{{ else }}🟡 <b>WARNING</b>{{ end }}: {{ .CommonLabels.alertname | html }}
              {{ range .Alerts }}• {{ .Annotations.summary | html }}{{ if .Annotations.description }}: {{ .Annotations.description | html }}{{ end }}
              {{ end }}
      - name: slack-warnings
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-notifications/slack-webhook-url
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}• {{ .Annotations.summary }}{{ if .Annotations.description }}: {{ .Annotations.description }}{{ end }}
              {{ end }}
    templates:
      - '/etc/alertmanager/config/*.tmpl'

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 400Mi
